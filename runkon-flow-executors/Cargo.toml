[package]
name = "runkon-flow-executors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable executor primitives for runkon-flow — event sinks, env providers, structured output parsing, and agent definition loading. No vendor coupling."
readme = "README.md"
keywords = ["workflow", "executor", "runkon", "agent", "automation"]
categories = ["development-tools"]

[features]
test-utils = ["runkon-flow/test-utils"]

[dependencies]
runkon-flow = { workspace = true }
runkon-runtimes = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
tracing = "0.1"

[dev-dependencies]
runkon-flow = { workspace = true, features = ["test-utils"] }
tempfile = "3"
