[package]
name = "runkon-flow"
version = "0.1.0-alpha"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable workflow execution engine — DSL, traits, and in-memory reference implementations"

[features]
test-utils = []
utoipa = ["dep:utoipa"]
sqlite = ["dep:rusqlite"]
# Per-run engine diagnostics: thread-local tracing subscriber + per-run log file
# + panic capture. Off by default — libraries shouldn't ship subscriber stacks
# unconditionally. Enable when you want the `run_with_per_run_log` helper.
diagnostics = ["dep:tracing-subscriber", "dep:tracing-appender"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }
tempfile = "3"
threadpool = "1"
wait-timeout = "0.2"
utoipa = { version = "5", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[[example]]
name = "echo_executor"

[[example]]
name = "static_items_provider"

[[example]]
name = "always_approve_gate"

[[example]]
name = "fixed_env_provider"

[[example]]
name = "stdout_event_sink"

[[example]]
name = "static_workflow_resolver"

[[example]]
name = "logging_child_runner"

[[example]]
name = "full_engine_minimal"
required-features = ["test-utils"]

[[test]]
name = "basic_flow"
required-features = ["test-utils"]

[[test]]
name = "control_flow"
required-features = ["test-utils"]

[[test]]
name = "engine_core"
required-features = ["test-utils"]

[[test]]
name = "foreach"
required-features = ["test-utils"]

[[test]]
name = "gates_and_errors"
required-features = ["test-utils"]

[[test]]
name = "lease_refresh"
required-features = ["test-utils"]

[[test]]
name = "cross_harness_composition"
required-features = ["test-utils"]
