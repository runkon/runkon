name: Close linked issues

# Closes the issues a PR names (`Closes #N`) when the PR merges into a release
# branch.
#
# GitHub closes those issues only when a PR merges into the default branch.
# Per-issue PRs merge into `release/X.Y.Z`, so without this workflow every
# issue has to be closed by hand. PRs into `main` don't match the trigger.
#
# Notes:
# - GraphQL `closingIssuesReferences` is empty for PRs whose base is not the
#   default branch (GitHub only records keyword links for default-branch
#   PRs). It still reports issues linked by hand in the sidebar, so the
#   issue list is the union of it and closing keywords parsed from the PR
#   body.
# - Only issues in this repo are closed; `owner/repo#N` references to other
#   repos are skipped.
# - A pull_request workflow runs from the base branch's copy of this file, so
#   it takes effect only for PRs merged after it lands in that branch.

on:
  pull_request:
    types: [closed]
    branches: ["release/**"]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          repo_lc=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"

          # 1. Issues linked through GitHub (sidebar "Development" panel).
          graphql_refs=$(gh api graphql \
            -f owner="$owner" -f name="$name" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) {
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                  | select((.repository.nameWithOwner | ascii_downcase) == "'"$repo_lc"'")
                  | .number') || {
            echo "::warning::closingIssuesReferences query failed; using PR body references only"
            graphql_refs=""
          }

          # 2. Closing keywords in the PR body, outside fenced code blocks.
          # Accepted: "Closes #N", "Fixes: #N", "Resolved owner/repo#N" and
          # "Closes https://github.com/owner/repo/issues/N", any case.
          body_refs=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced' \
            | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+|#[0-9]+)' \
            | sed -E 's/^.*[[:space:]]//' \
            | tr '[:upper:]' '[:lower:]' \
            | while read -r ref; do
                case "$ref" in
                  "#"*) echo "${ref#\#}" ;;
                  "https://github.com/$repo_lc/issues/"*) echo "${ref##*/}" ;;
                  "$repo_lc#"*) echo "${ref##*#}" ;;
                esac
              done || true)

          numbers=$(printf '%s\n%s\n' "$graphql_refs" "$body_refs" | grep -E '^[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No linked issues"
            exit 0
          fi

          failed=0
          summary() {
            echo "$1"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
          }

          for n in $numbers; do
            if ! info=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
                --jq '{state, pr: (.pull_request != null)} | "\(.state) \(.pr)"' 2>&1); then
              if printf '%s' "$info" | grep -q '404'; then
                summary "#$n: skipped (not found)"
              else
                summary "#$n: FAILED to look up: $info"
                failed=1
              fi
              continue
            fi
            state="${info% *}"
            is_pr="${info#* }"
            if [ "$is_pr" = "true" ]; then
              summary "#$n: skipped (pull request)"
            elif [ "$state" != "open" ]; then
              summary "#$n: skipped (already closed)"
            elif gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "Fixed by #${PR_NUMBER} (merged into ${BASE_REF} at ${MERGE_SHA:0:8})."; then
              summary "#$n: closed"
            else
              summary "#$n: FAILED to close"
              failed=1
            fi
          done

          exit "$failed"
