name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal workspace.package.version in Cargo.toml)"
        required: true
      dry_run:
        description: "Dry run: skip pushing tags, skip cargo publish (uses --dry-run), skip GH release"
        required: false
        default: "false"

permissions:
  contents: write
  # crates.io trusted publishing: exchanged for a short-lived publish token.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify input version matches Cargo.toml
        run: |
          ws_ver=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [[ "${{ inputs.version }}" != "$ws_ver" ]]; then
            echo "::error::workflow input version ${{ inputs.version }} != workspace version $ws_ver"
            exit 1
          fi

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Pre-flight build & test
        run: cargo test --locked --workspace --features runkon-flow/test-utils

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag crates
        run: ./scripts/release/tag.sh

      # Trusted publishing: trade the job's OIDC token for a short-lived crates.io
      # token, revoked when the job ends. Runs on dry runs too, so a dry run
      # also checks that crates.io still trusts this repo and workflow.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/release/publish.sh --dry-run
          else
            ./scripts/release/publish.sh
          fi

      # After publishing, so a failed publish doesn't leave tags pointing at a
      # release that never reached crates.io.
      - name: Push tags
        if: inputs.dry_run != 'true'
        run: |
          version="${{ inputs.version }}"
          mapfile -t tags < <(git tag --list "*-v${version}")
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::no local tags matching *-v${version}"
            exit 1
          fi
          # Idempotent: re-pushing an existing tag at the same commit is a no-op.
          git push origin "${tags[@]}"

      - name: Create GitHub release
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release/gh-release.sh
