fields:
  tasks:
    type: array
    items:
      id:
        type: string
        desc: "Short identifier like task-1, setup-db, add-api-route"
      description: string
      files:
        type: array
        desc: "Files this task will create or modify"
      dependencies?:
        type: array
        desc: "IDs of tasks that must complete before this one"
      complexity: enum(low, medium, high)
  risks?:
    type: array
    desc: "Risks or unknowns that should be resolved before implementing"
  decisions?:
    type: array
    desc: "Questions only the user can answer (scope, public API or compatibility, data, user-visible behaviour) that the ticket and its comments don't settle. Omit or leave empty when there are none; the run stops for them."
    items:
      question: string
      default:
        type: string
        desc: "What the plan does if the user approves without answering"
  estimated_minutes:
    type: number
    desc: "Estimated total minutes to complete the entire plan, including all tasks"
  summary: string

markers:
  has_complex_tasks: "tasks[complexity == high].length > 0"
  needs_decision: "decisions.length > 0"
