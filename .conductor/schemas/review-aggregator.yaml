fields:
  reviewed_by: string
  blocking_findings:
    type: array
    items:
      reviewer: string
      file: string
      line: number
      severity: enum(critical, warning)
      message: string
  overall_approved: boolean
  summary: string
  off_diff_findings:
    type: array
    items:
      file: string
      line: number
      severity: enum(critical, warning)
      title: string
      message: string
      reviewer: string
      labels:
        type: array
        items: string
  answered_findings?:
    type: array
    desc: "Findings already answered by a PR reply since the last review; shown but not blocking"
    items:
      reviewer: string
      file: string
      line: number
      severity: enum(critical, warning)
      message: string
      answered_by: string
      reply: string

markers:
  has_review_issues: "overall_approved == false"
  approved: "overall_approved == true"
  has_blocking_findings: "blocking_findings.length > 0"
  has_warnings: "blocking_findings[severity == warning].length > 0"
