[package]
name = "runkon-runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable agent runtime harness — spawn, poll, and cancel agents without depending on a host orchestrator's full domain"
readme = "README.md"
keywords = ["agent", "runtime", "subprocess", "harness", "runkon"]
categories = ["development-tools", "os"]

[features]
utoipa = ["dep:utoipa"]
test-utils = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
libc = "0.2"
utoipa = { version = "5", optional = true }

[dev-dependencies]
runkon-test-support = { path = "../runkon-test-support" }
tempfile = "3"
toml = "0.8"
