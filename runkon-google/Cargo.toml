[package]
name = "runkon-google"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Gemini API client and agent executor for runkon-flow. Supports both direct API calls and generic subprocess runtimes."
readme = "README.md"
keywords = ["google", "gemini", "llm", "agent", "runkon"]
categories = ["api-bindings", "development-tools"]

[features]
test-utils = ["runkon-flow/test-utils"]

[dependencies]
runkon-flow = { workspace = true }
runkon-flow-executors = { workspace = true }
runkon-runtimes = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"

[dev-dependencies]
runkon-flow = { workspace = true, features = ["test-utils"] }
runkon-flow-executors = { workspace = true, features = ["test-utils"] }
tempfile = "3"

[[example]]
name = "standalone_flow"
required-features = ["test-utils"]

[[example]]
name = "gemini_stream_json"
