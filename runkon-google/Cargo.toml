[package]
name = "runkon-google"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Gemini API client and agent executor for runkon-flow. Supports both direct API calls and generic subprocess runtimes."
readme = "README.md"
keywords = ["google", "gemini", "llm", "agent", "runkon"]
categories = ["api-bindings", "development-tools"]

[features]
test-utils = ["runkon-flow/test-utils"]

[dependencies]
runkon-flow = { path = "../runkon-flow", version = "0.5.0-alpha" }
runkon-flow-executors = { path = "../runkon-flow-executors", version = "0.5.0-alpha" }
runkon-runtimes = { path = "../runkon-runtimes", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"

[dev-dependencies]
runkon-flow = { path = "../runkon-flow", version = "0.5.0-alpha", features = ["test-utils"] }
tempfile = "3"

[[example]]
name = "standalone_flow"
required-features = ["test-utils"]
